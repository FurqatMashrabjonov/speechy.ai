name: speech_coach
description: "Speechy AI - Your AI Speaking Coach"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.0.0
  firebase_app_check: ^0.4.4+1
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0

  # Authentication
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17

  # AI
  firebase_ai: ^3.11.0

  # Audio
  record: ^6.2.0
  flutter_soloud: ^3.1.6
  audio_session: ^0.1.21
  path_provider: ^2.1.5

  # Charts
  fl_chart: ^0.70.2

  # Sharing
  share_plus: ^10.1.4

  # Storage
  shared_preferences: ^2.5.3

  # In-App Purchases
  purchases_flutter: ^10.1.0

  # URL Launcher
  url_launcher: ^6.3.1

  # In-App Review
  in_app_review: ^2.0.10

  # Confetti
  confetti: ^0.8.0

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  audioplayers: ^6.6.0
  flutter_native_splash: ^2.4.3
  firebase_analytics: ^12.4.1
  firebase_crashlytics: ^5.2.2
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#161412"
  image: assets/icon/app_icon.png
  image_dark: assets/icon/app_icon.png
  android_12:
    image: assets/icon/app_icon.png
    color: "#FFFFFF"
    image_dark: assets/icon/app_icon.png
    color_dark: "#161412"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#E8622A"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/images/
    - assets/images/characters/
    - assets/images/categories/
    - assets/images/tracks/career/
    - assets/images/tracks/social/
    - assets/images/tracks/stage/
    - assets/images/tracks/anxiety/
    - assets/images/tracks/tough/
    - assets/images/tracks/genz/
    - assets/icons/
    - assets/animations/
    - assets/audio/
